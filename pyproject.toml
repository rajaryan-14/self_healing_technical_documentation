[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-docs"
version = "0.1.0"
description = "Rules-first stale documentation detection for Python repositories"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
self-healing-docs = "self_healing_docs.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

